name: HQ Piper Remotion Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
      - name: Build narrated Remotion demo
        run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: abandoned-school-3d-hq-demo
          path: docs/demo/abandoned-school-3d-demo.mp4
          if-no-files-found: error
